# Ozav · filtro de ICP da esteira mensal (o dono edita este arquivo; # começa comentário).
# Depois de mudar, rode o mesmo comando: a etapa cnpj é reaproveitada e só o filtro, o site dos
# candidatos novos e a nota são refeitos.
#
# Filtros que já vêm do pipeline CNPJ v2 e NÃO se afrouxam aqui (só apertam): matriz ativa, fora do
# Simples/MEI, ao menos um vínculo estrangeiro, capital >= R$ 100 mil, natureza empresarial, fora do
# setor financeiro (CNAE 64/65/66 e nomes como BANCO, PAY, CAMBIO) e CNAE principal no cnae_alvo.csv.

[icp]
# UFs (sigla, separadas por vírgula). Vazio = todas.
ufs_incluir =
ufs_excluir =
# Capital social mínimo em reais (o pipeline já corta abaixo de 100000).
capital_minimo = 100000
# Porte da Receita: 0 não informado, 1 ME, 3 EPP, 5 demais.
portes = 0,1,3,5
# Idade da matriz em anos.
idade_min_anos = 0
idade_max_anos = 200
# Vínculos aceitos: PJ (PJ estrangeira direta), PJ_INDIRETO (via holding BR),
# FILIAL_SOC_ESTRANGEIRA, ND (tipo não identificado), PF (pessoa física estrangeira).
vinculos = PJ,PJ_INDIRETO,FILIAL_SOC_ESTRANGEIRA,ND,PF
# Nota mínima da base CNPJ (0 a 100).
nota_cnpj_minima = 0
# Grupos do cnae_alvo.csv que ficam fora (ex.: Turismo, E-commerce e varejo importado).
grupos_cnae_fora =
# Prefixos de CNAE que ficam fora (ex.: 7911,4781).
cnae_prefixos_fora =
# sim = só empresa com e-mail cadastral em domínio próprio (sem Gmail e sem contador).
so_dominio_proprio = nao

[concorrentes]
# Lista do vigia de concorrentes: exclui por domínio do site e por nome.
arquivo = concorrentes.csv
# Níveis de concorrência que ficam fora (o padrão é todos: ninguém da lista é cliente).
niveis = alta,média,baixa,a verificar
# Exclusões suas, opcionais: CSV com colunas cnpj_raiz,dominio,motivo.
exclusao_extra = exclusao_extra.csv
# Pasta dos retratos do vigia_bc.py (retratos/AAAA-MM-DD.csv). Vazio = sem o bloco do BC.
pasta_vigia_bc =

[site]
# Quantos candidatos (os de maior nota CNPJ) vão ao site antes do corte final.
candidatos = 1500
# Domínios em paralelo. Cada domínio recebe no máximo 1 pedido por segundo.
# workers = 1 dá 1 pedido por segundo no total (mais lento: ~1,5 h para 1.000 sites).
workers = 6
# auto (Crawl4AI se instalado), crawl4ai ou leve.
motor = auto

[nota]
# Nota final = peso_cnpj x nota CNPJ + peso_site x nota do site (as duas de 0 a 100).
peso_cnpj = 0.7
peso_site = 0.3
# Tamanho da lista final.
top = 1000
# Variação de nota que conta como "mudou" no novidades.md.
variacao_relevante = 5

[nota_site]
# Pontos de cada sinal do site (soma limitada a 100). 0 desliga o sinal.
sinal_matriz_exterior = 25
sinal_comex = 15
sinal_importa = 10
sinal_exporta = 10
sinal_clientes_exterior = 10
escritorio_exterior = 10
menciona_cambio = 10
vagas_alvo = 10
# "global" pega muito falso positivo (LEIA-ME do enriquecer_site): fica em 0.
sinal_global = 0
